[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datapulse"
version = "0.1.0"
description = "An automated exploratory data analysis (EDA) toolkit for tabular datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastexcel",
    "polars",
    "pydantic>=2.0",
    "rich",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "xlsxwriter",
]

[project.scripts]
datapulse = "datapulse.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/datapulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
